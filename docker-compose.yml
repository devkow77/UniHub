services:
  postgres:
    image: postgres:18
    container_name: unihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: unihub_dev_password
      POSTGRES_DB: unihub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
